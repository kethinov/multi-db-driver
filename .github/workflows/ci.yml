on: [push, pull_request]
name: CI
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # show all CI failures rather than stopping CI on first failure
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # --ignore-scripts skips a needless native build: better-sqlite3 has a binding.gyp and no install script of its own, so npm runs node-gyp for it even though the package ships prebuilt binaries for every platform in this matrix. that build is pure waste, and it fails outright on windows with node 22, whose bundled node-gyp cannot detect visual studio 2026
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run coverage
